[project]
name = "sigilora"
version = "0.1.0"
description = "Build and validation toolchain for the Sigilora symbol font project"
requires-python = ">=3.11"
dependencies = [
    "fonttools>=4.40",
    "uharfbuzz>=0.39",
    "svgutils>=0.3.4",
    "brotli>=1.1",
    "nanoemoji>=0.16",
    "ninja>=1.11",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
design = ["numpy>=1.26", "pillow>=10", "scipy>=1.11"]

[project.scripts]
sigilora = "sigilora_build.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
