name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install toolchain
        run: python -m pip install --upgrade pip && python -m pip install -e .

      - name: Setup Node (npm publish)
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Setup Bun (website)
        uses: oven-sh/setup-bun@v2

      # The game list and its order come from games.json (single source of
      # truth); adding a new game requires no changes to this workflow.
      - name: Build all fonts (normalize / build / validate / package)
        run: |
          for game in $(jq -r '.games[]' games.json); do
            sigilora normalize "$game"
            sigilora build "$game"
            sigilora validate "$game"
            sigilora package "$game"
          done

      - name: Generate npm package.json
        run: node scripts/gen-package-json.mjs

      - name: Assemble release assets
        run: |
          set -e
          PV="${PACKAGE_VERSION#v}"
          OUT="release-assets"
          mkdir -p "$OUT"
          for game in $(jq -r '.games[]' games.json); do
            LABEL="${game^}"
            FV=$(python -c "import tomllib;print(tomllib.load(open('fonts/$game/config.toml','rb'))['font-version'])")
            DOWN="fonts/$game/build"

            # Per-game zip: TTF + WOFF2 + license
            mkdir -p "$OUT/$game"
            cp "$DOWN/Sigilora-$LABEL-$FV.ttf" "$DOWN/Sigilora-$LABEL-$FV.woff2" "$DOWN/Sigilora-$LABEL-Lite-$FV.ttf" "$DOWN/Sigilora-$LABEL-Lite-$FV.woff2" LICENSE "$OUT/$game/"
            (cd "$OUT" && zip -q -r "Sigilora-$LABEL-$FV.zip" "$game" && rm -rf "$game")

            # Full snapshot zip: all games' TTF + WOFF2 + license
            mkdir -p "$OUT/Sigilora-Fonts/$game"
            cp "$DOWN/Sigilora-$LABEL-$FV.ttf" "$DOWN/Sigilora-$LABEL-$FV.woff2" "$DOWN/Sigilora-$LABEL-Lite-$FV.ttf" "$DOWN/Sigilora-$LABEL-Lite-$FV.woff2" LICENSE "$OUT/Sigilora-Fonts/$game/"
          done
          (cd "$OUT" && zip -q -r "Sigilora-Fonts-$PV.zip" Sigilora-Fonts && rm -rf Sigilora-Fonts)

          # Checksums
          (cd "$OUT" && sha256sum *.zip > SHA256SUMS)

      - name: Install website dependencies
        run: bun install
        working-directory: website

      - name: Sync fonts to website
        run: bun run fonts:sync
        working-directory: website

      - name: Build website
        run: bun run build
        working-directory: website

      - name: Deploy website to Cloudflare
        run: npx wrangler deploy
        working-directory: website
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Publish actions run last, after every build and deploy succeeded, so a
      # later failure never leaves an unre-runnable release or immutable npm
      # version already published.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sigilora ${{ github.ref_name }}"
          generate_release_notes: true
          files: release-assets/*

      - name: Publish npm package (Trusted Publishing)
        run: |
          PV="${PACKAGE_VERSION#v}"
          npm version "$PV" --no-git-tag-version
          npm publish --access public --provenance
        working-directory: packages/fonts
