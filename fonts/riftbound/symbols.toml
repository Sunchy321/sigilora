# Riftbound symbol font mappings.
# Text representations follow the official Riftbound shorthand:
# [E] exhaust, [M] Might, domain runes by color letter ([R][G][B][O][P][Y]),
# [A] any-domain power, [0]-[9] + [X] number symbols.
# [C] (own-domain power) is intentionally absent: it has no printed graphic;
# cards print the card's own domain rune instead, so authors write the domain letter.
#
# Styles: default (colored as printed; runes are bare domain-color glyphs without
# the UI circle, numbers are dark circle + white digit). "inverted" (反色) is a
# monochrome style via ss01: white glyphs for everything except numbers, which
# become white circle + dark digit (the Riot energy_* form).

[[symbols]]
name = "exhaust"
ligature = ["[E]"]
category = "action"
svg = { default = "exhaust.svg", inverted = "exhaust-inv.svg" }


[[symbols]]
name = "might"
ligature = ["[M]"]
category = "action"
svg = { default = "might.svg", inverted = "might-inv.svg" }


