# Pokémon TCG energy symbol font mappings.
# Each energy converts through the standard liga feature from both a bracket
# ([G]) and brace ({G}) representation of the energy type's single letter.
# The letters follow the community EssentiarumTCG font convention that the
# icon reconstruction was extracted from: C colorless, D darkness, F fighting,
# G grass, L lightning, M metal, N dragon, P psychic, R fire, W water, Y fairy.

[[symbols]]
name = "grass"
ligature = ["[G]", "{G}"]
category = "energy"
svg = { default = "grass.svg" }


