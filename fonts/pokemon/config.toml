name = "Pokémon TCG"
code = "pokemon"
font-version = "0.3.0"
colr-version = "v1"

# The Lite family carries only the default style (bare currentColor symbols),
# which is fully COLRv0-expressible. Unlike the full family it is therefore
# built as COLRv0 directly — it needs neither COLRv1 nor a fallback flavor.
lite-colr-version = "v0"

[[categories]]
name = "energy"

# Styles: default (bare symbol in currentColor, for embedding in running text),
# orb (glossy energy ball), flat (flat round badge with the font's official disc
# colour). default/orb/flat share one canonical outline per energy; orb and flat
# differ only in shading. Style order drives ssXX: orb -> ss01, flat -> ss02.
[[styles]]
name = "default"

[[styles]]
name = "orb"

[[styles]]
name = "flat"

[compose]

# Engines without COLRv1 (Safari / WKWebView / native CoreText etc.) get a v0
# fallback flavor built from this same source: identical glyphs and version,
# colour encoding downgraded to COLRv0. orb's glossy gradient cannot be
# expressed in v0, so in the fallback flavor the orb style draws flat's art
# (the same flat disc); default (bare currentColor symbol) and flat are v0
# as-is.
[colr-fallback]
style-art = { orb = "flat" }
